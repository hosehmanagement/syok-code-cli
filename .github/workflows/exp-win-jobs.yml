name: exp win jobs (experiment, not a test)
on:
  push:
    branches: [exp/win-jobs]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun exp/win-jobs-diag.ts
