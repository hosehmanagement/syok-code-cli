name: plugins live test
# Every plugin on the Syok list, used by a real AI on a small real project, and "syok plugin find" with the AI choosing.
# Each check reads files, git and test results, never the AI's own claim. Linux only, to keep the cost low.
on:
  workflow_dispatch:
  pull_request:
    paths: ['plugins/**', 'src/plugin-list.ts', 'src/plugins.ts', 'src/usage.ts', 'scripts/build-plugins.ts', 'test/live/plugins-live.sh', '.github/workflows/plugins-live.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SYOK_BASE_URL: ${{ secrets.SYOK_BASE_URL }}
      SYOK_API_KEY: ${{ secrets.SYOK_API_KEY }}
      MODEL: syok-coder
    steps:
      - name: Hide the Syok address in the logs
        # GitHub hides the exact secret only; the address is also printed as a bare host (by syok doctor, for example).
        # This hides the host, the address with or without /v1, and the Cloudflare account number inside it, in every later step.
        env:
          U: ${{ secrets.SYOK_BASE_URL }}
        shell: bash
        run: |
          h="${U#*://}"; h="${h%%/*}"
          for v in "$h" "${U%/}" "${U%/v1}" "${U%/v1/}"; do [ -n "$v" ] && echo "::add-mask::$v"; done
          a="${h#syok-ai-router-personal-}"; a="${a%%.*}"; [ -n "$a" ] && [ "$a" != "$h" ] && echo "::add-mask::$a"
          exit 0
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Secrets present
        run: if [ -z "$SYOK_BASE_URL" ] || [ -z "$SYOK_API_KEY" ]; then echo "the Syok secrets are not set"; exit 1; fi
      - name: Build the one-file program
        run: bun build src/main.ts --target=bun --minify --outfile "$RUNNER_TEMP/syok.js"
      - name: Every plugin, with a real AI, from the one-file program
        run: bash test/live/plugins-live.sh "$RUNNER_TEMP/syok.js"
