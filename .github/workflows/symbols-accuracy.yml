name: find_symbol accuracy
# Measures find_symbol and outline against a compiler-grade answer (the TypeScript compiler's syntax tree, and Python's own
# "ast" module) on three real projects at fixed versions. Each language must find at least 97% of the definitions, and at
# least 97% of what it reports must be a real definition. The floor is fixed: if a change drops below it, fix the change.
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/symbols.ts', 'test/bench/**', '.github/workflows/symbols-accuracy.yml']
permissions:
  contents: read
jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Download the three projects at fixed versions
        run: bash test/bench/fetch-projects.sh "$RUNNER_TEMP/projects"
      - name: Measure
        run: bun test/bench/symbols-bench.ts "$RUNNER_TEMP/projects/mocha" "$RUNNER_TEMP/projects/nest" "$RUNNER_TEMP/projects/click" --check | tee -a "$GITHUB_STEP_SUMMARY"
