name: modal live test
# Runs the real "syok run --on modal" path against Modal. Needs two repository secrets: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
# Costs a few cents of that Modal account's credit per run (CPU only, about two minutes). Runs by hand, and on pull requests that change the remote-run code.
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/remote*.ts', 'test/live/**', '.github/workflows/modal-live.yml', 'package.json', 'bun.lock']
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Live test (skips itself when the secrets are not set)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: bun test/live/modal-live.ts
