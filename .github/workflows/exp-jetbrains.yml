name: exp-jetbrains
on:
  push:
    branches: ['exp/jetbrains']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: tests and build
        working-directory: jetbrains
        run: gradle --no-daemon --stacktrace test buildPlugin
      - name: what was built
        working-directory: jetbrains
        run: ls -la build/distributions && unzip -l build/distributions/*.zip | tail -8
      - name: verify against the editors
        working-directory: jetbrains
        run: gradle --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jetbrains-build, path: "jetbrains/build/distributions/*.zip\njetbrains/build/reports/**" }
