name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test ./test
      - run: bun evals/run.ts --check
  # Windows is tested for real: the shell picker, skills, the Windows safety rules and the skill run are run on a Windows machine.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Windows tests (must pass)
        run: bun test test/shell.test.ts test/skills.test.ts test/perm-win.test.ts test/skillrun.test.ts test/bridge.test.ts test/doctor.test.ts test/agents.test.ts test/mcp-http.test.ts test/symbols.test.ts test/cloud.test.ts test/confine.test.ts test/confine-win.test.ts test/mcp-auth.test.ts test/memory.test.ts test/lsp.test.ts test/setup.test.ts test/parallel.test.ts test/plugin-list.test.ts
      - name: Which shell was picked
        run: bun -e "import('./src/shell.ts').then(m=>console.log(m.currentShell()))"
      - name: PowerShell shell test
        env:
          SYOK_SHELL: powershell
        run: bun test test/shell.test.ts test/skillrun.test.ts
      - name: Command Prompt shell test
        env:
          SYOK_SHELL: cmd
        run: bun test test/shell.test.ts test/skillrun.test.ts
      - name: Every test on Windows (information only)
        continue-on-error: true
        run: bun test ./test
  # --confine is tested for real on Linux (bubblewrap) and Mac (sandbox-exec), as an ordinary user: writes outside the project,
  # reading key folders and (with no-network) the network must really be refused. A tool that does not work here FAILS the job.
  confine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYOK_REQUIRE_CONFINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Linux, install bubblewrap and allow ordinary programs to use it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          id -u
      - run: bun test test/confine.test.ts test/action-e2e.test.ts
      - name: syok doctor names the confinement tool as found
        run: |
          bun src/main.ts doctor | tee doctor.txt
          grep -Eq "OK    (bubblewrap|sandbox-exec). found" doctor.txt
  # Windows has no confinement tool of its own, so Windows users are pointed to WSL (Windows' own Linux). This runs the real
  # confinement tests inside WSL on a Windows machine, as an ordinary user, to prove that advice works.
  confine-wsl:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: bubblewrap curl unzip git ca-certificates
      - name: Install Bun inside WSL and make an ordinary user
        shell: wsl-bash {0}
        run: |
          set -e
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s "bun-v1.4.4"
          bun --version
          id tester 2>/dev/null || useradd -m -s /bin/bash tester
          uname -a
      - name: The confinement tests, inside WSL, as an ordinary user
        shell: wsl-bash {0}
        run: |
          set -e
          rm -rf /home/tester/repo && mkdir -p /home/tester/repo && cp -r src test package.json bun.lock /home/tester/repo/ && chown -R tester:tester /home/tester/repo
          su tester -c 'cd /home/tester/repo && id -u && bun install --frozen-lockfile && SYOK_REQUIRE_CONFINE=1 bun test test/confine.test.ts'
  # The one-line installers are run for real on Linux, Mac and Windows against a freshly built program.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the program and serve it on this machine
        shell: bash
        run: |
          mkdir -p site
          bun build src/main.ts --target=bun --minify --outfile site/syok.js
          bun -e "const b=require('fs').readFileSync('site/syok.js');require('fs').writeFileSync('site/syok.js.sha256',require('crypto').createHash('sha256').update(b).digest('hex')+'  syok.js\n')"
          nohup bun -e "Bun.serve({port:8765,hostname:'127.0.0.1',fetch:(r)=>{const f=Bun.file('site'+new URL(r.url).pathname);return f.exists().then(e=>e?new Response(f):new Response('no',{status:404}))}})" > server.log 2>&1 &
          sleep 2; curl -fsS http://127.0.0.1:8765/syok.js.sha256
      - name: Install twice, then use it (Mac and Linux)
        if: runner.os != 'Windows'
        env:
          SYOK_SITE: http://127.0.0.1:8765
          SYOK_HOME: ${{ runner.temp }}/syokhome
        run: |
          sh install/install.sh
          sh install/install.sh
          "$SYOK_HOME/bin/syok" --help | head -n 3
          "$SYOK_HOME/bin/syok" jobs | grep "No saved jobs"
          "$SYOK_HOME/bin/syok" update | grep "up to date"
          echo damaged >> site/syok.js
          if sh install/install.sh; then echo "a damaged download was accepted"; exit 1; fi
          "$SYOK_HOME/bin/syok" jobs | grep "No saved jobs"
      - name: Install twice, then use it (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SYOK_SITE: http://127.0.0.1:8765
          SYOK_HOME: ${{ runner.temp }}\syokhome
        run: |
          $before = [Environment]::GetEnvironmentVariable('Path','User')
          Get-Content -Raw install/install.ps1 | Invoke-Expression
          Get-Content -Raw install/install.ps1 | Invoke-Expression
          & "$env:SYOK_HOME\bin\syok.cmd" --help | Select-Object -First 3
          $j = & "$env:SYOK_HOME\bin\syok.cmd" jobs; if ("$j" -notmatch 'No saved jobs') { throw "jobs: $j" }
          $u = & "$env:SYOK_HOME\bin\syok.cmd" update; if ("$u" -notmatch 'up to date') { throw "update: $u" }
          $p = [Environment]::GetEnvironmentVariable('Path','User'); if (($p -split ';' | Where-Object { $_ -eq "$env:SYOK_HOME\bin" }).Count -ne 1) { throw "PATH entry count wrong: $p" }
          Add-Content site/syok.js 'damaged'
          $failed = $false; try { Get-Content -Raw install/install.ps1 | Invoke-Expression } catch { $failed = $true }
          if (-not $failed) { throw 'a damaged download was accepted' }
          $j = & "$env:SYOK_HOME\bin\syok.cmd" jobs; if ("$j" -notmatch 'No saved jobs') { throw "after failed update: $j" }
  # The VS Code extension is tested inside a real VS Code on Linux, Windows and Mac: the extension starts the real syok
  # program (built here) in the editor's own terminal, against a stand-in AI server. The installable .vsix file is kept.
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYOK_REQUIRE_REAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm ci --no-audit --no-fund
        working-directory: vscode
      - run: npm run test:unit
        working-directory: vscode
      - name: Tests inside VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
        working-directory: vscode
      - name: Tests inside VS Code (Windows, Mac)
        if: runner.os != 'Linux'
        run: npm run test:vscode
        working-directory: vscode
      - name: Build the installable file
        if: runner.os == 'Linux'
        run: npm run package
        working-directory: vscode
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: syok-code-vscode
          path: vscode/syok-code.vsix

  # The JetBrains add-on: its own tests, the installable zip, and JetBrains' checker run against real editors.
  jetbrains:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: Tests and the installable zip
        working-directory: jetbrains
        run: gradle --no-daemon test buildPlugin
      - name: The zip holds the add-on
        working-directory: jetbrains
        run: |
          ls -la build/distributions
          unzip -l build/distributions/*.zip | grep -q "syok-code-jetbrains.*\.jar"
      - name: JetBrains' own checker, against real editors
        working-directory: jetbrains
        run: gradle --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: syok-code-jetbrains
          path: jetbrains/build/distributions/*.zip
