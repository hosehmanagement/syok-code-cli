name: cloud live test
# "syok cloud" for real: pushes work to the private test repository hosehmanagement/syok-cloud-test, opens a draft pull request,
# and the @syok job there finishes the work with a real AI. Then it checks the result and removes what it made.
# Needs the repository secret CLOUD_TEST_TOKEN: a GitHub token for the test repository only
# (Contents, Issues, Pull requests, Secrets: read and write; Actions: read).
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/cloud.ts', 'src/action.ts', 'test/live/cloud-live.sh', '.github/workflows/cloud-live.yml']
permissions:
  contents: read
concurrency:
  group: cloud-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.CLOUD_TEST_TOKEN }}
      SYOK_BASE_URL: ${{ secrets.SYOK_BASE_URL }}
      SYOK_API_KEY: ${{ secrets.SYOK_API_KEY }}
      TEST_REPO: hosehmanagement/syok-cloud-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Secrets present
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "The secret CLOUD_TEST_TOKEN is not set."; exit 1; fi
          if [ -z "$SYOK_BASE_URL" ] || [ -z "$SYOK_API_KEY" ]; then echo "The Syok secrets are not set."; exit 1; fi
      - name: The live test
        run: bash test/live/cloud-live.sh "$PWD/src/main.ts"
